<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:320px;overflow:hidden;background:#0e141b}
.b{position:relative;width:1280px;height:320px;font-family:Inter,sans-serif;color:#fff;overflow:hidden;
 background:radial-gradient(ellipse 620px 360px at 960px 160px,rgba(102,192,244,.18),transparent 70%),
 radial-gradient(ellipse 500px 300px at 120px 340px,rgba(196,150,44,.16),transparent 70%),
 linear-gradient(120deg,#0f1922 0%,#1b2838 55%,#16202d 100%)}
.grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#66c0f4 1px,transparent 1px),linear-gradient(90deg,#66c0f4 1px,transparent 1px);background-size:32px 32px;
 -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%,#000 100%)}
.left{position:absolute;left:56px;top:48px;width:590px}
.kicker{font-size:14px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#66c0f4}
h1{font-family:"Inter Display",Inter;font-weight:800;font-size:56px;line-height:1.02;margin-top:12px;letter-spacing:-.01em}
h1 span{background:linear-gradient(90deg,#f2d27a,#d4a338);-webkit-background-clip:text;color:transparent}
.sub{margin-top:14px;font-size:17px;color:#b8c6d3;line-height:1.35}
.chips{margin-top:18px;display:flex;gap:10px}
.chip{font-size:14px;font-weight:600;padding:7px 12px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#dfe8f0}
.chip b{color:#f2d27a}
.panel{position:absolute;right:40px;top:26px;width:600px;padding:10px;border-radius:8px;background:rgba(30,33,39,.92);
 box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.row{display:flex;align-items:center;gap:12px;height:62px;padding:0 12px 0 8px;background:#2a2e35;border-radius:3px;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.row img{width:46px;height:46px;flex:none;border-radius:2px}
.row.rare{background:linear-gradient(90deg,#3a3424,#2c2f36 70%);box-shadow:0 0 0 1px rgba(242,200,90,.6),0 0 22px rgba(242,190,70,.3)}
.row.rare img{box-shadow:0 0 0 2px #e9c15a,0 0 14px rgba(242,190,70,.75)}
.txt{flex:1;min-width:0}
.n{font-size:15px;font-weight:500;color:#fff}
.d{font-size:12.5px;color:#b0b7bf;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{font-size:11.5px;color:#8a929b;margin-top:2px}
.rare .p{color:#e9c15a}
.g{font-size:11.5px;color:#8a929b;text-align:right;flex:none;width:120px;line-height:1.3}
</style></head><body><div class="b"><div class="grid"></div>
<div class="left">
 <div class="kicker">Millennium plugin for Steam</div>
 <h1>Steam Custom<br><span>Achievements</span></h1>
 <div class="sub">Xbox 360 achievements for Steam games that never got them.</div>
 <div class="chips"><div class="chip"><b>11</b> games</div><div class="chip"><b>611</b> achievements</div><div class="chip">Desktop &amp; Big Picture</div></div>
</div>
<div class="panel">%%ROWS%%</div>
</div></body></html>
