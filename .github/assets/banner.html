<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:320px;overflow:hidden;background:#0e141b}
.b{position:relative;width:1280px;height:320px;font-family:Inter,sans-serif;color:#fff;overflow:hidden;
 background:radial-gradient(ellipse 620px 360px at 980px 160px,rgba(102,192,244,.22),transparent 70%),
 radial-gradient(ellipse 500px 300px at 120px 340px,rgba(196,150,44,.16),transparent 70%),
 linear-gradient(120deg,#0f1922 0%,#1b2838 55%,#16202d 100%)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#66c0f4 1px,transparent 1px),linear-gradient(90deg,#66c0f4 1px,transparent 1px);background-size:32px 32px;
 -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%,#000 100%)}
.left{position:absolute;left:64px;top:58px;width:610px}
.kicker{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#66c0f4}
h1{font-family:"Inter Display",Inter;font-weight:800;font-size:60px;line-height:1.02;margin-top:14px;letter-spacing:-.01em}
h1 span{background:linear-gradient(90deg,#f2d27a,#d4a338);-webkit-background-clip:text;color:transparent}
.sub{margin-top:16px;font-size:20px;color:#b8c6d3;line-height:1.35}
.chips{margin-top:20px;display:flex;gap:10px}
.chip{font-size:14px;font-weight:600;padding:7px 12px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#dfe8f0}
.chip b{color:#f2d27a}
.stack{position:absolute;right:56px;top:36px;width:440px}
.card{position:relative;display:flex;align-items:center;gap:16px;height:76px;padding:0 18px 0 12px;margin-bottom:12px;border-radius:6px;
 background:linear-gradient(90deg,#2a3f5a,#1e2d40);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.card:nth-child(1){transform:translateX(28px);opacity:.55}
.card:nth-child(2){transform:translateX(0)}
.card:nth-child(3){transform:translateX(-28px);opacity:.75}
.card.rare{background:linear-gradient(90deg,#3b3523,#24303f);box-shadow:0 0 0 1px rgba(242,210,122,.55),0 0 28px rgba(242,190,70,.35),0 10px 30px rgba(0,0,0,.45)}
.ico{width:54px;height:54px;border-radius:4px;flex:none;display:grid;place-items:center}
.t1{font-size:13px;color:#8fb3cf;font-weight:500}
.t2{font-size:18px;font-weight:700;margin-top:3px}
.t3{font-size:12px;color:#c9a64a;margin-top:3px;font-weight:600}
.bar{height:5px;width:180px;background:#0f1923;border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:75%;background:linear-gradient(90deg,#4aa3df,#66c0f4)}
</style></head><body><div class="b"><div class="grid"></div>
<div class="left">
 <div class="kicker">Millennium plugin for Steam</div>
 <h1>Steam Custom<br><span>Achievements</span></h1>
 <div class="sub">Xbox 360 achievements for Steam games that never got them.</div>
 <div class="chips"><div class="chip"><b>10</b> games</div><div class="chip"><b>555</b> achievements</div><div class="chip">Desktop &amp; Big Picture</div></div>
</div>
<div class="stack">
 <div class="card"><div class="ico" style="background:linear-gradient(135deg,#3d6d8f,#1f3a52)">
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#cfe6f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 1-4.5 4.3L17.6 20 12 17l-5.6 3 1.1-6.7L3 9l6-1z"/></svg></div>
  <div><div class="t1">Progress</div><div class="t2">Collector</div><div class="bar"><i></i></div></div></div>
 <div class="card rare"><div class="ico" style="background:linear-gradient(135deg,#f2d27a,#a8781e)">
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2a1d05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></div>
  <div><div class="t1">Achievement Unlocked!</div><div class="t2">Legend of the Wastes</div><div class="t3">Rare · 4.2% of players</div></div></div>
 <div class="card"><div class="ico" style="background:linear-gradient(135deg,#5a8f4a,#2c4a24)">
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e3f5d8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
  <div><div class="t1">Achievement Unlocked!</div><div class="t2">First Steps</div></div></div>
</div></div></body></html>
